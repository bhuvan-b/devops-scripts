ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_PVT_KEY') }}"

ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
  -o ProxyCommand="ssh
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
  -o IdentityFile={{ ansible_ssh_private_key_file }}
  -W %h:%p ubuntu@{{ hostvars[groups['jump_hosts'][0]]['ansible_host'] }}"