- name: nginx-setup
  hosts: "aws_ec2:&jump_hosts"
  become: true

  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Start Nginx
      service:
        name: nginx
        state: started

    - name: Copy html file to remote server
      ansible.builtin.copy:
        src: "{{ project_path }}/src/framer_site.html"
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Update Nginx Config File
      ansible.builtin.template:
        src: "{{ project_path }}/src/nginx.conf.j2"
        dest: /etc/nginx/nginx.conf
      vars:
        http_port: 3000
        root_dir: /var/www/html
      notify: Restart Nginx

  handlers:
    - name: Restart nginx
      service:
        name: nginx
        state: restarted 