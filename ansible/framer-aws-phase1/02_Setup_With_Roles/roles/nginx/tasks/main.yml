    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Start Nginx
      service:
        name: nginx
        state: started

    - name: Copy html file to remote server
      ansible.builtin.copy:
        src: src/framer_site.html
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Update Nginx Config File
      ansible.builtin.template:
        src: src/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: Restart Nginx